name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # Or "master" depending on your repo

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Copy JSON to dist
        # This manually moves your JSON file into the build output folder
        # if it isn't already handled by the Vite public folder.
        run: cp EToutline.json dist/

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          # This is the crucial part: it only uploads the 'dist' folder
          path: 'dist/'

  deploy:
    needs: build_site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4